name: Deploy personal site and HKPC preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout personal site
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build personal site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Fetch HKPC static snapshot
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth=1 --branch gh-pages https://github.com/cuetotech/hkpc.git "$tmp/hkpc"
          rm -rf "$tmp/hkpc/.git"
          sudo chown -R "$USER:$USER" _site
          rm -rf _site/hkpc
          mkdir -p _site/hkpc
          cp -a "$tmp/hkpc/." _site/hkpc/
          test -s _site/hkpc/index.html
          test -s _site/hkpc/capture-report.json
          printf '\nHKPC preview files: '
          find _site/hkpc -type f | wc -l

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
